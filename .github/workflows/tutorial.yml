# Follows the "Create a theme" tutorial on a fresh copy of sightpress/theme-template (tools/tutorial/), so the
# tutorial's commands, snippets and the messages it quotes keep matching what SightPress does.
name: Tutorial

on:
  pull_request:
    paths:
      - docs/tutorials/**
      - tools/tutorial/**
      - .github/workflows/tutorial.yml
  push:
    branches: [main]
    paths:
      - docs/tutorials/**
      - tools/tutorial/**
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-a-theme:
    name: create a theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: docs

      - uses: actions/checkout@v7
        with:
          repository: sightpress/theme-template
          path: template

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, intl, sodium, exif, fileinfo, pdo_sqlite
          ini-values: date.timezone=UTC, memory_limit=512M
          coverage: pcov
          tools: composer:v2

      # The package is what git archive makes, as on Packagist, so files left out by .gitattributes are missing here too.
      - name: Create the theme from the template's package with composer create-project
        run: |
          archive="$RUNNER_TEMP/theme-template.zip"
          git -C template archive --format=zip --output="$archive" HEAD
          repository="$(jq -c --arg url "file://$archive" \
            '{type: "package", package: (. + {version: "0.1.99", dist: {type: "zip", url: $url}})}' \
            template/composer.json)"
          composer create-project --no-interaction --no-progress --prefer-dist \
            --repository="$repository" sightpress/theme-template theme 0.1.99

      - name: Follow the tutorial
        run: docs/tools/tutorial/create-a-theme.sh "$GITHUB_WORKSPACE/theme"
