[project]
site_name = "SightPress documentation"
site_description = "Documentation for SightPress, a powerful multi-site, multilingual CMS for everyone, designed with blind and low-vision creators and audiences in mind."
site_url = "https://sightpress.github.io/docs/"
repo_url = "https://github.com/sightpress/docs"
repo_name = "sightpress/docs"
edit_uri = "edit/main/docs/"
copyright = "SightPress is free software, licensed under the GNU GPL v3.0 or later."

# Warnings fail the build, including builds started by mike.
strict = true

# Internal documents that live next to the pages but are not published.
exclude_docs = """
adr/
"""

nav = [
  { "Home" = "index.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.extra.version]
provider = "mike"
default = "latest"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.permalink_title = "Link to this section"
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = false
