[project]
site_name = "SightPress documentation"
site_description = "Documentation for SightPress, a powerful multi-site, multilingual CMS for everyone, designed with blind and low-vision creators and audiences in mind."
site_url = "https://docs.sightpress.org/"
repo_url = "https://github.com/sightpress/docs"
repo_name = "sightpress/docs"
edit_uri = "edit/main/docs/"
copyright = 'SightPress is free software, licensed under the GNU GPL v3.0 or later. Everyone who takes part follows our <a href="https://github.com/sightpress/docs/blob/main/CODE_OF_CONDUCT.md">Code of Conduct</a>.'

# Warnings fail the build, including builds started by mike.
strict = true

# Internal documents that live next to the pages but are not published.
exclude_docs = """
adr/
"""

nav = [
  { "Home" = "index.md" },
  { "What you can build" = "what-you-can-build.md" },
  { "Getting started" = "getting-started.md" },
  { "How-to guides" = [
    "how-to/index.md",
    { "Create a website" = "how-to/create-a-site.md" },
    { "Write and publish a page" = "how-to/write-and-publish-a-page.md" },
    { "Schedule a page" = "how-to/schedule-a-page.md" },
    { "Restore an older version" = "how-to/restore-an-older-version.md" },
    { "Move or rename a page" = "how-to/move-or-rename-a-page.md" },
    { "Put a page in the trash" = "how-to/put-a-page-in-the-trash.md" },
    { "Add a language" = "how-to/add-a-language.md" },
    { "Make a site members-only" = "how-to/make-a-site-members-only.md" },
    { "Let people sign up" = "how-to/let-people-sign-up.md" },
    { "Change your email or password" = "how-to/change-your-email-or-password.md" },
    { "Turn features on or off" = "how-to/turn-features-on-or-off.md" },
    { "Install and change a theme" = "how-to/install-and-change-a-theme.md" },
    { "Search your website" = "how-to/search-your-website.md" },
    { "See who visits your website" = "how-to/see-who-visits-your-website.md" },
    { "Use the AI assistant" = "how-to/use-the-ai-assistant.md" },
    { "Update SightPress" = "how-to/update-sightpress.md" },
    { "Fix upload size limits" = "how-to/fix-upload-size-limits.md" },
    { "Run SightPress in the background" = "how-to/run-in-the-background.md" },
    { "Change the ports" = "how-to/change-the-ports.md" },
    { "Start a database server" = "how-to/start-a-database.md" },
    { "Open the test e-mail inbox" = "how-to/open-the-test-email-inbox.md" },
    { "Open the file storage console" = "how-to/open-the-file-storage-console.md" },
    { "Try the command line tool" = "how-to/try-the-command-line-tool.md" },
    { "Codes we send you" = "how-to/codes-we-send-you.md" },
  ] },
  { "Help improve SightPress" = [
    { "Report a problem" = "how-to/report-a-problem.md" },
    { "Translate SightPress" = "how-to/translate-sightpress.md" },
    { "Review the interface" = "how-to/review-the-interface.md" },
    { "Review a theme change" = "how-to/review-a-theme-change.md" },
    { "Test with assistive technology" = "how-to/test-with-assistive-technology.md" },
  ] },
  { "Reference" = [
    { "Roles and permissions" = "reference/roles-and-permissions.md" },
    { "Blocks" = "reference/blocks.md" },
    { "Search and AI visibility" = "reference/search-and-ai.md" },
    { "Command line" = "reference/command-line.md" },
  ] },
]

# SightPress brand (copied from the brand guide): self-hosted fonts and design tokens, then the docs styles.
extra_css = [
  "brand/fonts/fonts.css",
  "brand/tokens/tokens.css",
  "stylesheets/sightpress.css",
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
custom_dir = "overrides"
# Fonts are self-hosted from docs/brand/fonts, so no requests go to Google Fonts.
font = false
logo = "brand/logo/sightpress-logo.svg"
favicon = "brand/favicons/favicon.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.extra.version]
provider = "mike"
default = "latest"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.permalink_title = "Link to this section"
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = false
